# ============================================================
#  APIGasoline - Infraestructura (Fase 1)
#  Servicios: MySQL 8.0 + MinIO (almacenamiento de imágenes)
#
#  Uso:
#    docker compose up -d          -> levanta MySQL y MinIO
#    docker compose ps             -> ver estado (deben decir "healthy")
#    docker compose logs -f minio  -> ver logs de un servicio
#    docker compose down           -> detener (los datos se conservan)
#    docker compose down -v        -> detener y BORRAR los datos
#
#  La API todavía corre desde Visual Studio (Fase 3 la agrega aquí).
#  Las variables ${...} se leen del archivo .env (ver .env.example).
# ============================================================

name: apigasoline

services:

  # ---------- Base de datos ----------
  db:
    image: mysql:8.0
    container_name: apigasoline-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-apigasoline}
      TZ: America/Mexico_City
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 3307 en tu PC -> 3306 en el contenedor (evita choque con un MySQL local)
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Almacenamiento de objetos (imágenes) ----------
  minio:
    # MinIO retiró sus imágenes de Docker Hub (sep. 2026) y Quay ya no permite descargas anónimas.
    # pgsty/minio es un fork comunitario compatible (mismas variables, puertos y cliente "mc").
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: apigasoline-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: America/Mexico_City
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # API S3 (la usa la aplicación)
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Consola web: http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- Crea el bucket privado (se ejecuta una vez y termina) ----------
  minio-init:
    # La imagen del servidor ya incluye el cliente "mc"; así no se depende de otra imagen
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: apigasoline-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-apigasoline}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET &&
      echo 'Bucket listo:' $$MINIO_BUCKET
      "
    restart: "no"

volumes:
  mysql-data:
  minio-data:
