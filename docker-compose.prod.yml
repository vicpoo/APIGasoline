# ============================================================
#  APIGasoline - PRODUCCIÓN (EC2)
#  Servicios: API + MySQL 8.0 + MinIO
#
#  Uso en el servidor:
#    docker compose -f docker-compose.prod.yml up -d --build
#    docker compose -f docker-compose.prod.yml ps
#    docker compose -f docker-compose.prod.yml logs -f api
#
#  Las variables ${...} se leen del archivo .env del servidor
#  (copia .env.production.example como .env y llénalo).
# ============================================================

name: apigasoline

services:

  # ---------- API ----------
  api:
    build: .
    image: apigasoline-api:latest
    container_name: apigasoline-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${MYSQL_DATABASE:-apigasoline};User=root;Password=${MYSQL_ROOT_PASSWORD};"
      Jwt__Key: ${JWT_KEY}
      Minio__Endpoint: minio:9000
      # "auto" = las URLs de las fotos se firman con el host que usó el cliente (IP pública de EC2) + puerto 9000
      Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-auto}
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__Bucket: ${MINIO_BUCKET:-apigasoline}
      Minio__UseSsl: "false"
      Push__Proveedor: ${PUSH_PROVEEDOR:-NoOp}
      Push__Firebase__CredencialesPath: /app/secrets/apigasoline-firebase.json
      Seguridad__SembrarAlIniciar: "true"
      Seguridad__AdminEmail: ${ADMIN_EMAIL}
      Seguridad__AdminPassword: ${ADMIN_PASSWORD}
      TZ: America/Mexico_City
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "${API_PORT:-80}:8080"

  # ---------- Base de datos (sin puerto público) ----------
  db:
    image: mysql:8.0
    container_name: apigasoline-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-apigasoline}
      TZ: America/Mexico_City
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # Solo accesible desde el propio servidor (útil para un túnel SSH)
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Almacenamiento de objetos (imágenes) ----------
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: apigasoline-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: America/Mexico_City
    ports:
      - "9000:9000"              # API S3: los celulares descargan las fotos por aquí (URLs firmadas)
      - "127.0.0.1:9001:9001"    # Consola web: solo por túnel SSH
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- Crea el bucket privado (se ejecuta una vez y termina) ----------
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: apigasoline-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-apigasoline}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET &&
      echo 'Bucket listo:' $$MINIO_BUCKET
      "
    restart: "no"

volumes:
  mysql-data:
  minio-data:
