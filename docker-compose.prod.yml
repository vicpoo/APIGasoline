# ============================================================
#  APIGasoline - PRODUCCIÓN (EC2)
#  Servicios: API + SQL Server 2022 (Express) + MinIO
#  La API NO usa sa (F013): opera con apigasoline_app (solo datos) y migra con
#  apigasoline_migrador (db_owner solo de su base). Los crea db-init.
#  OJO: SQL Server necesita x64 (no corre en instancias ARM/Graviton) y al menos 2 GB de RAM.
#
#  Uso en el servidor:
#    docker compose -f docker-compose.prod.yml up -d --build
#    docker compose -f docker-compose.prod.yml ps
#    docker compose -f docker-compose.prod.yml logs -f api
#
#  Las variables ${...} se leen del archivo .env del servidor
#  (copia .env.production.example como .env y llénalo).
# ============================================================

name: apigasoline

services:

  # ---------- API ----------
  api:
    build: .
    image: apigasoline-api:latest
    container_name: apigasoline-api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Opera con un login que solo lee y escribe datos...
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${MSSQL_DATABASE:-apigasoline};User Id=apigasoline_app;Password=${MSSQL_APP_PASSWORD};TrustServerCertificate=True;"
      # ...y aplica las migraciones al arrancar con otro que puede cambiar el esquema de su base
      ConnectionStrings__Migraciones: "Server=db,1433;Database=${MSSQL_DATABASE:-apigasoline};User Id=apigasoline_migrador;Password=${MSSQL_MIGRADOR_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY}
      Minio__Endpoint: minio:9000
      # "auto" = las URLs de las fotos se firman con el host que usó el cliente (IP pública de EC2) + puerto 9000
      Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-auto}
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__Bucket: ${MINIO_BUCKET:-apigasoline}
      Minio__UseSsl: "false"
      Push__Proveedor: ${PUSH_PROVEEDOR:-NoOp}
      Push__Firebase__CredencialesPath: /app/secrets/apigasoline-firebase.json
      BaseDatos__MigrarAlIniciar: "true"
      Seguridad__SembrarAlIniciar: "true"
      Seguridad__AdminEmail: ${ADMIN_EMAIL}
      Seguridad__AdminPassword: ${ADMIN_PASSWORD}
      TZ: America/Mexico_City
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "${API_PORT:-80}:8080"

  # ---------- Base de datos (sin puerto público) ----------
  # db-init crea la base y los logins; la API crea las tablas al arrancar (BaseDatos__MigrarAlIniciar = true).
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: apigasoline-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Express = gratis para producción (límite: 10 GB por BD, 1 socket / 4 núcleos, 1.4 GB de RAM para el buffer).
      # Developer NO tiene licencia para producción.
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      TZ: America/Mexico_City
    # Solo accesible desde el propio servidor (útil para un túnel SSH)
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Crea la base y los logins de la API (se ejecuta en cada arranque y termina) ----------
  # Idempotente: si ya existen, solo actualiza las contraseñas con las del .env.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: apigasoline-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_DATABASE: ${MSSQL_DATABASE:-apigasoline}
      MSSQL_APP_PASSWORD: ${MSSQL_APP_PASSWORD}
      MSSQL_MIGRADOR_PASSWORD: ${MSSQL_MIGRADOR_PASSWORD}
    volumes:
      - ./BD/produccion:/scripts:ro
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -b
      -v MSSQL_DATABASE=\"$$MSSQL_DATABASE\" MSSQL_APP_PASSWORD=\"$$MSSQL_APP_PASSWORD\" MSSQL_MIGRADOR_PASSWORD=\"$$MSSQL_MIGRADOR_PASSWORD\"
      -i /scripts/crear-logins.sql
      "
    restart: "no"

  # ---------- Almacenamiento de objetos (imágenes) ----------
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: apigasoline-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: America/Mexico_City
    ports:
      - "9000:9000"              # API S3: los celulares descargan las fotos por aquí (URLs firmadas)
      - "127.0.0.1:9001:9001"    # Consola web: solo por túnel SSH
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- Crea el bucket privado (se ejecuta una vez y termina) ----------
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: apigasoline-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-apigasoline}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET &&
      echo 'Bucket listo:' $$MINIO_BUCKET
      "
    restart: "no"

volumes:
  mssql-data:
  minio-data:
